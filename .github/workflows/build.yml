name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip -o *.zip
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9
    - name: Build with Gradle
      run: |
        # 'app' ফোল্ডারটি কোথায় আছে তা খুঁজে বের করা
        APP_DIR=$(find . -type d -name "app" | head -n 1)
        if [ -z "$APP_DIR" ]; then
          echo "Error: app folder not found!"
          exit 1
        fi
        
        # 'app' ফোল্ডারের প্যারেন্ট ডিরেক্টরি (মেইন প্রজেক্ট ফোল্ডার) খুঁজে বের করা
        PROJECT_ROOT=$(dirname "$APP_DIR")
        echo "Project root found at: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        # দরকারি ফাইলগুলো তৈরি করা
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
        echo "android.useAndroidX=true" > gradle.properties
        
        # বিল্ড রান করা
        gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BanglaQRStudio-APK
        path: '**/app-debug.apk'
