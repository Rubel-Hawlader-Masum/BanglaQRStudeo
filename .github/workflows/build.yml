name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip -o BanglaQRStudio_Final_GitHub_Project.zip
    - name: Create Root Files
      run: |
        # Enter the extracted folder
        if [ -d "BanglaQRStudio_Android" ]; then cd BanglaQRStudio_Android; fi
        if [ -d "BanglaQRStudio_Final_GitHub_Project" ]; then cd BanglaQRStudio_Final_GitHub_Project; fi
        
        # Create necessary gradle files
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
        echo "android.useAndroidX=true" > gradle.properties
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9
    - name: Build with Gradle
      run: |
        # Enter the folder again to build
        if [ -d "BanglaQRStudio_Android" ]; then cd BanglaQRStudio_Android; fi
        if [ -d "BanglaQRStudio_Final_GitHub_Project" ]; then cd BanglaQRStudio_Final_GitHub_Project; fi
        
        gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BanglaQRStudio-APK
        path: '**/app-debug.apk'
