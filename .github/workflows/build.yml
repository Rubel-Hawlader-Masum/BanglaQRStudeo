name: Build Premium APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip Project
      run: unzip -o *.zip
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9
    - name: Build with Gradle
      run: |
        APP_DIR=$(find . -type d -name "app" | head -n 1)
        PROJECT_ROOT=$(dirname "$APP_DIR")
        cd "$PROJECT_ROOT"
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
        echo "android.useAndroidX=true" > gradle.properties
        gradle assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BanglaQR-Premium-APK
        path: '**/app-debug.apk'
